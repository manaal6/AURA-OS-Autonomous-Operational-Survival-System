<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" style="background:#050505">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2a2a2a"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e0e0e" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="640" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="3">AURA OS — ORCHESTRATION ARCHITECTURE DAG</text>
  <text x="450" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#4f8ef7" letter-spacing="2">GOOGLE ANTIGRAVITY · 10-AGENT REACTIVE PIPELINE</text>
  <line x1="60" y1="55" x2="840" y2="55" stroke="#111" stroke-width="1"/>

  <!-- ═══ ANTIGRAVITY RUNTIME BOX ═══ -->
  <rect x="30" y="65" width="840" height="555" rx="8" fill="none" stroke="#4f8ef720" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="46" y="80" font-family="monospace" font-size="8" fill="#4f8ef740" letter-spacing="1">ANTIGRAVITY RUNTIME</text>

  <!-- ═══ EVENT BUS (horizontal) ═══ -->
  <rect x="60" y="90" width="780" height="36" rx="5" fill="#05000f" stroke="#4f8ef730" stroke-width="1"/>
  <text x="450" y="104" text-anchor="middle" font-family="monospace" font-size="8" fill="#4f8ef7" letter-spacing="1" font-weight="700">⬡  ANTIGRAVITY EVENT BUS</text>
  <text x="450" y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#4f8ef755">AGENT_STEP · CONTRADICTION_EVENT · EXECUTION_EVENT · RECOVERY_EVENT · OUTCOME_EVENT</text>

  <!-- ═══ AGENT NODES — ROW 1 (agents 1–5) ═══ -->
  <!-- Node helper: box at cx,cy width 120 height 52 -->

  <!-- Agent 1: Input Processing -->
  <rect x="60" y="155" width="120" height="52" rx="5" fill="#0a0f1a" stroke="#4f8ef750" stroke-width="1"/>
  <text x="120" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#4f8ef7" font-weight="700" letter-spacing="1">AGENT 01</text>
  <text x="120" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" font-weight="600">Input</text>
  <text x="120" y="196" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb">Processing</text>
  <text x="120" y="207" text-anchor="middle" font-family="monospace" font-size="7" fill="#4b5563">AGENT_STEP</text>

  <!-- Agent 2: Signal Extraction -->
  <rect x="220" y="155" width="120" height="52" rx="5" fill="#0d0a1a" stroke="#a78bfa50" stroke-width="1"/>
  <text x="280" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#a78bfa" font-weight="700" letter-spacing="1">AGENT 02</text>
  <text x="280" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" font-weight="600">Signal</text>
  <text x="280" y="196" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb">Extraction</text>
  <text x="280" y="207" text-anchor="middle" font-family="monospace" font-size="7" fill="#4b5563">AGENT_STEP</text>

  <!-- Agent 3: Contradiction Detection — highlighted -->
  <rect x="380" y="148" width="140" height="64" rx="5" fill="#100a00" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow-amber)"/>
  <text x="450" y="165" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b" font-weight="700" letter-spacing="1">AGENT 03  ⚡</text>
  <text x="450" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" font-weight="600">Contradiction</text>
  <text x="450" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb">Detection</text>
  <text x="450" y="202" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b">CONTRADICTION_EVENT</text>

  <!-- Agent 4: Insight -->
  <rect x="560" y="155" width="120" height="52" rx="5" fill="#0a0f0f" stroke="#06b6d450" stroke-width="1"/>
  <text x="620" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#06b6d4" font-weight="700" letter-spacing="1">AGENT 04</text>
  <text x="620" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" font-weight="600">Insight /</text>
  <text x="620" y="196" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb">Credibility</text>
  <text x="620" y="207" text-anchor="middle" font-family="monospace" font-size="7" fill="#4b5563">AGENT_STEP</text>

  <!-- Agent 5: Impact Analysis -->
  <rect x="720" y="155" width="120" height="52" rx="5" fill="#0f0a05" stroke="#f9731650" stroke-width="1"/>
  <text x="780" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#f97316" font-weight="700" letter-spacing="1">AGENT 05</text>
  <text x="780" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" font-weight="600">Impact</text>
  <text x="780" y="196" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb">Analysis</text>
  <text x="780" y="207" text-anchor="middle" font-family="monospace" font-size="7" fill="#4b5563">AGENT_STEP</text>

  <!-- ARROWS ROW 1 -->
  <line x1="180" y1="181" x2="218" y2="181" stroke="#2a2a2a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="340" y1="181" x2="378" y2="181" stroke="#2a2a2a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="522" y1="181" x2="558" y2="181" stroke="#2a2a2a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="181" x2="718" y2="181" stroke="#2a2a2a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══ SHARED MEMORY BAR ═══ -->
  <rect x="60" y="238" width="780" height="30" rx="4" fill="#070f09" stroke="#10b98125" stroke-width="1"/>
  <text x="450" y="250" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" letter-spacing="1" font-weight="700">SHARED ORCHESTRATION MEMORY</text>
  <text x="450" y="262" text-anchor="middle" font-family="monospace" font-size="7" fill="#1a4a30">orchId · riskScore · inventoryRunway · confidenceMap · contraResolved · supplierHealth · poNumber · phase</text>

  <!-- Arrows down to memory bar -->
  <line x1="120" y1="207" x2="120" y2="237" stroke="#4f8ef725" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="280" y1="207" x2="280" y2="237" stroke="#a78bfa25" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="450" y1="213" x2="450" y2="237" stroke="#f59e0b35" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="620" y1="207" x2="620" y2="237" stroke="#06b6d425" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="780" y1="207" x2="780" y2="237" stroke="#f9731625" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- ═══ AGENT NODES — ROW 2 (agents 6–8) ═══ -->

  <!-- Agent 6: Action Planning -->
  <rect x="130" y="295" width="130" height="52" rx="5" fill="#070f0a" stroke="#10b98150" stroke-width="1"/>
  <text x="195" y="312" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" font-weight="700" letter-spacing="1">AGENT 06</text>
  <text x="195" y="324" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" font-weight="600">Action</text>
  <text x="195" y="336" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb">Planning</text>
  <text x="195" y="347" text-anchor="middle" font-family="monospace" font-size="7" fill="#4b5563">AGENT_STEP</text>

  <!-- Agent 7: Constraint Validation -->
  <rect x="310" y="295" width="140" height="52" rx="5" fill="#0c0a14" stroke="#8b5cf650" stroke-width="1"/>
  <text x="380" y="312" text-anchor="middle" font-family="monospace" font-size="7" fill="#8b5cf6" font-weight="700" letter-spacing="1">AGENT 07</text>
  <text x="380" y="324" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" font-weight="600">Constraint</text>
  <text x="380" y="336" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb">Validation</text>
  <text x="380" y="347" text-anchor="middle" font-family="monospace" font-size="7" fill="#4b5563">AGENT_STEP</text>

  <!-- Agent 8: Execution Simulation — highlighted -->
  <rect x="500" y="288" width="150" height="64" rx="5" fill="#0f0514" stroke="#ec4899" stroke-width="1.5"/>
  <text x="575" y="305" text-anchor="middle" font-family="monospace" font-size="7" fill="#ec4899" font-weight="700" letter-spacing="1">AGENT 08  ⚙</text>
  <text x="575" y="318" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" font-weight="600">Execution</text>
  <text x="575" y="330" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb">Simulation</text>
  <text x="575" y="342" text-anchor="middle" font-family="monospace" font-size="7" fill="#ec4899">EXECUTION_EVENT</text>
  <text x="575" y="352" text-anchor="middle" font-family="monospace" font-size="7" fill="#4b5563">retry backoff · prob failure</text>

  <!-- Arrows from memory bar down to row 2 -->
  <line x1="195" y1="268" x2="195" y2="294" stroke="#10b98130" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="380" y1="268" x2="380" y2="294" stroke="#8b5cf630" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="575" y1="268" x2="575" y2="287" stroke="#ec489930" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Arrows row 2 chain -->
  <line x1="260" y1="321" x2="308" y2="321" stroke="#2a2a2a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="321" x2="498" y2="321" stroke="#2a2a2a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══ EXECUTION ENGINE BOX ═══ -->
  <rect x="680" y="280" width="160" height="100" rx="5" fill="#080508" stroke="#ec489920" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="760" y="297" text-anchor="middle" font-family="monospace" font-size="7" fill="#ec489980" letter-spacing="1">EXECUTION ENGINE</text>
  <text x="760" y="312" text-anchor="middle" font-family="monospace" font-size="8" fill="#6b7280">POST /erp/validate</text>
  <text x="760" y="325" text-anchor="middle" font-family="monospace" font-size="8" fill="#6b7280">POST /notify/proc</text>
  <text x="760" y="338" text-anchor="middle" font-family="monospace" font-size="8" fill="#ef4444">POST /supplier/A → 503</text>
  <text x="760" y="351" text-anchor="middle" font-family="monospace" font-size="8" fill="#6b7280">retry ×2 → FALLBACK</text>
  <text x="760" y="364" text-anchor="middle" font-family="monospace" font-size="8" fill="#22c55e">POST /supplier/D → 201</text>
  <text x="760" y="377" text-anchor="middle" font-family="monospace" font-size="8" fill="#6b7280">PUT /crm/etas/bulk</text>
  <line x1="651" y1="320" x2="678" y2="320" stroke="#ec489940" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- ═══ ROW 3: Recovery + Monitoring ═══ -->

  <!-- Agent 9: Recovery -->
  <rect x="220" y="390" width="150" height="64" rx="5" fill="#140505" stroke="#ef4444" stroke-width="1.5" filter="url(#glow-amber)"/>
  <text x="295" y="407" text-anchor="middle" font-family="monospace" font-size="7" fill="#ef4444" font-weight="700" letter-spacing="1">AGENT 09  🔄</text>
  <text x="295" y="420" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" font-weight="600">Recovery /</text>
  <text x="295" y="432" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb">Failure Handling</text>
  <text x="295" y="444" text-anchor="middle" font-family="monospace" font-size="7" fill="#ef4444">RECOVERY_EVENT</text>
  <text x="295" y="454" text-anchor="middle" font-family="monospace" font-size="7" fill="#4b5563">fallback score · arbitration</text>

  <!-- Agent 10: Monitoring -->
  <rect x="430" y="390" width="150" height="64" rx="5" fill="#030f07" stroke="#22c55e" stroke-width="1.5" filter="url(#glow-green)"/>
  <text x="505" y="407" text-anchor="middle" font-family="monospace" font-size="7" fill="#22c55e" font-weight="700" letter-spacing="1">AGENT 10  📈</text>
  <text x="505" y="420" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb" font-weight="600">Monitoring &amp;</text>
  <text x="505" y="432" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5e7eb">Outcome Eval</text>
  <text x="505" y="444" text-anchor="middle" font-family="monospace" font-size="7" fill="#22c55e">OUTCOME_EVENT</text>
  <text x="505" y="454" text-anchor="middle" font-family="monospace" font-size="7" fill="#4b5563">heartbeat · audit ledger</text>

  <!-- Arrows to row 3 -->
  <!-- Execution → Recovery (failure path, red dashed) -->
  <path d="M575 352 L575 370 L295 370 L295 389" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="440" y="368" text-anchor="middle" font-family="monospace" font-size="7" fill="#ef4444">FAILURE PATH — 503×3</text>

  <!-- Recovery → Monitoring -->
  <line x1="371" y1="422" x2="428" y2="422" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Arrows from memory bar down to row 3 -->
  <line x1="295" y1="268" x2="295" y2="285" stroke="#ef444415" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="505" y1="268" x2="505" y2="285" stroke="#22c55e15" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- ═══ CONTRADICTION ENGINE SIDEBAR ═══ -->
  <rect x="60" y="390" width="148" height="100" rx="5" fill="#080500" stroke="#f59e0b30" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="134" y="407" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b80" letter-spacing="1">CONTRA ENGINE</text>
  <text x="134" y="423" text-anchor="middle" font-family="monospace" font-size="8" fill="#78350f">credibility scoring</text>
  <text x="134" y="436" text-anchor="middle" font-family="monospace" font-size="8" fill="#78350f">timestamp decay</text>
  <text x="134" y="449" text-anchor="middle" font-family="monospace" font-size="8" fill="#78350f">trust propagation</text>
  <text x="134" y="462" text-anchor="middle" font-family="monospace" font-size="8" fill="#78350f">conflict score 0–1</text>
  <text x="134" y="475" text-anchor="middle" font-family="monospace" font-size="8" fill="#78350f">resolution rationale</text>
  <!-- Arrow from Agent 3 down to sidebar -->
  <path d="M450 213 L450 500 L210 500 L210 490 L209 490" fill="none" stroke="#f59e0b25" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- ═══ OUTCOME SECTION ═══ -->
  <rect x="60" y="500" width="780" height="85" rx="6" fill="#030a05" stroke="#22c55e25" stroke-width="1"/>
  <text x="450" y="518" text-anchor="middle" font-family="monospace" font-size="8" fill="#22c55e" font-weight="700" letter-spacing="1.5">OUTCOME — SYSTEM STABILIZED</text>

  <!-- Before/After columns -->
  <rect x="80" y="526" width="200" height="48" rx="4" fill="#0e0000" stroke="#ef444420" stroke-width="1"/>
  <text x="180" y="540" text-anchor="middle" font-family="monospace" font-size="8" fill="#ef4444">BEFORE</text>
  <text x="180" y="554" text-anchor="middle" font-family="monospace" font-size="9" fill="#f87171">Stockout: 94%  |  Rev at Risk: $218K</text>
  <text x="180" y="568" text-anchor="middle" font-family="monospace" font-size="9" fill="#f87171">SLA Breach: 73%  |  Risk Score: 8.2</text>

  <text x="450" y="554" text-anchor="middle" font-family="monospace" font-size="14" fill="#22c55e">→</text>

  <rect x="530" y="526" width="290" height="48" rx="4" fill="#000e07" stroke="#22c55e30" stroke-width="1"/>
  <text x="675" y="540" text-anchor="middle" font-family="monospace" font-size="8" fill="#22c55e">AFTER  ·  PO CONFIRMED  ·  HB ACTIVE</text>
  <text x="675" y="554" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80">Stockout: 7%   |  Rev at Risk: $0</text>
  <text x="675" y="568" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80">SLA Breach: 4%  |  Risk Score: 1.2</text>

  <!-- Arrow from Agent 10 down to outcome -->
  <line x1="505" y1="454" x2="505" y2="499" stroke="#22c55e30" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>

  <!-- ═══ LEGEND ═══ -->
  <text x="450" y="608" text-anchor="middle" font-family="monospace" font-size="7" fill="#2a2a2a" letter-spacing="1">
    ── reactive state flow  ╌╌ memory read  ─── failure path  ─── success path
  </text>
  <text x="450" y="622" text-anchor="middle" font-family="monospace" font-size="7" fill="#1a1a1a" letter-spacing="1">
    AURA OS v1.0  ·  #AISeekho 2026  ·  Google Antigravity Hackathon
  </text>
</svg>
